name: Export PyroCb notebook to Python

on:
  push:
    branches: [main]
    paths:
      - "Fire_evolution_pyrocb.ipynb"
      - ".github/workflows/export-firms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export marked notebook cells
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          notebook_path = Path("Fire_evolution_pyrocb.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          blocks = [
              "".join(cell.get("source", []))
              for cell in notebook["cells"]
              if cell.get("cell_type") == "code"
              and "".join(cell.get("source", [])).lstrip().startswith("# EXPORT_TO_GITHUB")
          ]
          if not blocks:
              raise RuntimeError("No code cells marked # EXPORT_TO_GITHUB")

          code = (
              "# Generated from Fire_evolution_pyrocb.ipynb by GitHub Actions. Edit the notebook instead.\n\n"
              + "\n\n".join(blocks) + "\n"
          )
          compile(code, "Fire_evolution_pyrocb.py", "exec")
          Path("Fire_evolution_pyrocb.py").write_text(code, encoding="utf-8")
          print(f"Exported {len(blocks)} cells to Fire_evolution_pyrocb.py")
          PYCODE

      - name: Commit generated Python module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fire_evolution_pyrocb.py
          if ! git diff --cached --quiet; then
            git commit -m "Update FIRMS Python module from Colab [skip ci]"
            git push
          else
            echo "Generated module is already current."
          fi


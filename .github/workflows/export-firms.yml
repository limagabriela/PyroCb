name: Export PyroCb notebook to Python

on:
  push:
    branches: [main]
    paths:
      - "fire_evolution_pyrocb.ipynb"
      - "Fire_evolution_pyrocb.ipynb"
      - ".github/workflows/export-firms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export and validate notebook cells
        shell: bash
        run: |
          python - <<'PYCODE'
          import ast
          import json
          from pathlib import Path

          # The notebook is currently stored with an initial lowercase f.
          options = [Path("fire_evolution_pyrocb.ipynb"), Path("Fire_evolution_pyrocb.ipynb")]
          notebook_path = next((p for p in options if p.exists()), None)
          if notebook_path is None:
              raise FileNotFoundError("Neither notebook filename exists in the repository root")

          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          blocks = [
              "".join(cell.get("source", []))
              for cell in notebook["cells"]
              if cell.get("cell_type") == "code"
              and "".join(cell.get("source", [])).lstrip().startswith("# EXPORT_TO_GITHUB")
          ]
          if not blocks:
              raise RuntimeError("No code cells marked # EXPORT_TO_GITHUB")

          code = (
              f"# Generated automatically from {notebook_path.name}. Edit the notebook, not this file.\n\n"
              + "\n\n".join(blocks) + "\n"
          )
          compile(code, "Fire_evolution_pyrocb.py", "exec")

          names = {
              node.name for node in ast.parse(code).body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          expected = {
              "baixar_firms", "baixar_e_processar_firms",
              "gerar_figura_serie_temporal", "gerar_figura_mapa",
              "save_publication_figure"
          }
          if not expected.issubset(names):
              raise RuntimeError(f"Missing exported functions: {sorted(expected - names)}")

          Path("Fire_evolution_pyrocb.py").write_text(code, encoding="utf-8")
          print(f"Source notebook: {notebook_path.name}")
          print(f"Exported {len(blocks)} cells; {len(code.splitlines())} lines")
          print(f"Hourly plot present: {'frp_max_mw' in code and 'TIME_BIN_HOURS' in code}")
          PYCODE

      - name: Commit generated module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fire_evolution_pyrocb.py
          if ! git diff --cached --quiet; then
            git commit -m "Update FIRMS module from notebook [skip ci]"
            git push
          else
            echo "Python module already up to date."
          fi

